[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-web-scraper"
version = "0.1.0"
description = "MCP server that fetches webpages and extracts structured data"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1,<2",
    "httpx",
    "beautifulsoup4",
    "lxml",
]

# Tell setuptools that our packages live under the src/ directory
# instead of the project root (the standard "src layout").
[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "api.mcp:app"